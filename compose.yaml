services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: products_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-proot", "-h", "127.0.0.1", "-e", "SELECT 1 FROM products_db.products LIMIT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql_data:
